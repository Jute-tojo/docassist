services:
  - type: web
    name: docassist-api
    runtime: python
    plan: free
    region: frankfurt  # Closest Render region to Supabase (eu-west-1)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SEUIL_SCORE
        value: "0.5"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
